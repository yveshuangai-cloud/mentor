<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2048 2048" role="img" aria-labelledby="title desc">
  <title id="title">AIEQ 16 Swiss modernist animal emblems</title>
  <desc id="desc">Sixteen animal identity images with exact four-letter personality codes overlaid in the upper left.</desc>
  <style>
    .tile { fill: #F7F4F2; stroke: #505158; stroke-width: 3; }
    .code { fill: #505158; font: 700 42px Arial, sans-serif; letter-spacing: 3px; }
  </style>
  <rect width="2048" height="2048" fill="#F7F4F2"/>

  <g transform="translate(0 0)"><rect class="tile" x="8" y="8" width="496" height="496" rx="22"/><image x="12" y="12" width="488" height="488" xlink:href="istj-beaver.png"/><text class="code" x="34" y="62">ISTJ</text></g>
