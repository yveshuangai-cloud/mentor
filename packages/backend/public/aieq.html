<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>AI Personality｜AI 人格誌</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--pink:#ff1785;--green:#41ff78;--black:#050505;--white:#f5f4f0;--gray:#9b9b9b;--line:#3b3b3b}*{box-sizing:border-box}html,body{margin:0;background:var(--black);color:var(--white);font-family:"Noto Sans TC","PingFang TC",Arial,sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:24px 24px}main{position:relative;width:min(100%,520px);min-height:100svh;margin:auto;overflow:hidden;padding:0 18px 88px}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.wordmark{font-size:14px;font-weight:900;letter-spacing:.12em}.wordmark i{color:var(--pink);font-style:normal}.tag{font:700 9px ui-monospace,monospace;letter-spacing:.06em;border:1px solid #666;padding:5px 7px}.eyebrow{color:var(--green);font:800 11px ui-monospace,monospace;letter-spacing:.16em}.display{font-size:clamp(38px,11vw,62px);line-height:.94;letter-spacing:-.06em;margin:20px 0}.pink{color:var(--pink)}.lead{font-size:16px;line-height:1.7}.micro{color:var(--gray);font-size:11px;line-height:1.65}.hero{padding:38px 0 12px;min-height:690px;position:relative}.hero-copy{position:relative;z-index:2}.issue{font:700 10px ui-monospace,monospace;position:absolute;right:0;top:42px;writing-mode:vertical-rl;letter-spacing:.15em}.hero-animal{display:block;width:88%;height:280px;object-fit:contain;margin:-8px auto 0;filter:saturate(1.15)}.city{height:73px;margin:5px -18px 18px;background:var(--pink);clip-path:polygon(0 100%,0 62%,5% 62%,5% 34%,10% 34%,10% 77%,15% 77%,15% 48%,20% 48%,20% 67%,25% 67%,25% 20%,31% 20%,31% 55%,36% 55%,36% 39%,41% 39%,41% 72%,47% 72%,47% 30%,52% 30%,52% 58%,58% 58%,58% 13%,63% 13%,63% 68%,69% 68%,69% 40%,75% 40%,75% 74%,80% 74%,80% 25%,86% 25%,86% 57%,92% 57%,92% 36%,100% 36%,100% 100%)}.primary,.secondary,.choice{width:100%;min-height:54px;border-radius:0;padding:15px 17px}.primary{background:var(--pink);border:1px solid var(--pink);color:#050505;font-weight:900;text-align:center;letter-spacing:.05em}.secondary{background:transparent;border:1px solid #686868;color:var(--white)}.panel{border:1px solid var(--line);padding:20px;margin:22px 0;background:rgba(5,5,5,.96)}.error{border-color:var(--pink)}
.question-shell{padding-top:28px}.question-head{display:flex;justify-content:space-between;align-items:end}.counter{font:900 44px ui-monospace,monospace;color:var(--pink);line-height:1}.counter small{font-size:13px;color:var(--white)}.progress{height:2px;background:#333;margin:15px 0 28px}.progress i{display:block;height:100%;background:var(--green)}.scenario{color:var(--green);font-size:13px;font-weight:800;line-height:1.65}.prompt{font-size:28px;line-height:1.3;letter-spacing:-.03em;margin:13px 0 24px}.choice{display:grid;grid-template-columns:35px 1fr;gap:11px;text-align:left;background:transparent;color:var(--white);border:1px solid #606060;margin:10px 0}.choice .letter{color:var(--pink);font:900 20px ui-monospace,monospace}.choice strong{display:block;font-size:16px}.choice span span{display:block;color:#aaa;font-size:11px;margin-top:4px}.choice:hover,.choice:focus{border-color:var(--green);outline:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.result{padding-top:25px}.result-hero{position:relative;min-height:385px}.result-code{color:var(--pink);font:900 clamp(70px,23vw,112px)/.82 ui-monospace,monospace;letter-spacing:-.09em;margin:22px 0 5px}.result-title{color:var(--green);font-size:22px;margin:0;position:relative;z-index:2}.result-animal{display:block;width:90%;height:275px;object-fit:contain;margin:-14px auto 0}.story-grid{border-top:1px solid var(--green)}.story{padding:17px 0;border-bottom:1px solid var(--line)}.story small{display:block;color:var(--pink);font:800 10px ui-monospace,monospace;letter-spacing:.12em}.story p{margin:7px 0 0;line-height:1.6}.axis{display:grid;grid-template-columns:48px 1fr 45px;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #292929;font-size:12px}.bar{height:4px;background:#333}.bar i{display:block;height:100%;background:var(--pink)}.axis b{color:var(--green);font-size:11px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #555;margin:0 0 24px}.tabs button{padding:11px 4px;border:0;border-right:1px solid #555;background:transparent;color:#aaa;font-size:12px}.tabs button:last-child{border:0}.tabs button.active{background:var(--green);color:#050505;font-weight:900}.cover-stage{border:1px solid #555;aspect-ratio:9/16;overflow:hidden;background:#050505}.cover-stage img{width:100%;height:100%;object-fit:cover}.preview-note{margin:10px 0 20px;color:#aaa;font-size:11px}.share-actions{display:grid;gap:9px}.share-actions .secondary{text-align:center}.friend{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #333}.friend img{width:54px;height:54px;object-fit:cover;background:#000}nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(5,5,5,.97);border-top:1px solid #444;padding:8px 12px max(8px,env(safe-area-inset-bottom))}nav div{width:min(100%,520px);margin:auto;display:grid;grid-template-columns:1fr 1fr}nav button{border:0;background:transparent;color:#aaa;padding:10px}nav button.active{color:var(--pink);font-weight:900}@media(min-width:700px){main{border-left:1px solid #242424;border-right:1px solid #242424}}
</style></head><body><main><header class="topbar"><div class="wordmark">AI <i>PERSONALITY</i><br>AI 人格誌</div><span class="tag" id="modePill">NON-DIAGNOSTIC</span></header><section id="loading" class="panel">正在確認 LINE 身分…</section><section id="error" class="panel error hidden"></section><section id="inviteCard" class="panel hidden"></section>
<section id="introView" class="hidden"><div class="hero"><div class="issue">ISSUE 01 · AI × HUMAN</div><div class="hero-copy"><div class="eyebrow">7 SCENARIOS / 60 SECONDS</div><h1 class="display">你是哪一種<br><span class="pink">AI 人格？</span></h1><p class="lead">不是測你多會用 AI，<br>而是看見你與 AI 相處的直覺。</p></div><img class="hero-animal" src="/aieq/scenes/start/start-exploration-v1.png" alt="人的直覺與 AI 相遇"><button id="startBtn" class="primary">開始探索 →</button><p class="micro">七個日常情境，憑直覺選擇。結果描述目前傾向，不是心理診斷或官方 MBTI® 測驗。</p></div></section>
<section id="testView" class="hidden"><div id="questionCard" class="question-shell"></div></section><section id="resultView" class="hidden"><div id="resultCard"></div></section><section id="friendsView" class="hidden"><div class="panel"><div class="eyebrow">AI PERSONALITY / SOCIAL</div><h2>我的人格朋友圈</h2><p class="micro">只有朋友開啟邀請且雙方同意後，才會互相看見結果。</p><button id="shareBtn" class="primary">邀請一位朋友</button><button id="deleteBtn" class="secondary">刪除我的全部資料</button></div><div id="friendList" class="panel"></div></section></main><nav class="hidden" id="nav"><div><button data-view="result" class="active">我的人格誌</button><button data-view="friends">朋友圈</button></div></nav>
<style>.cover-stage{position:relative}.cover-stage .player-avatar{position:absolute;z-index:2;right:4.9%;top:2.7%;width:29.5%;height:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #f5f4f0;background:#050505}.hero-animal{width:calc(100% + 36px);height:390px;margin:-42px -18px 10px;object-fit:cover}.result-hero{min-height:720px}.result-code,.result-title{position:relative;z-index:2}.result-animal{width:calc(100% + 36px);height:550px;margin:-30px -18px -18px;object-fit:cover}
</style>
<script>
const $=s=>document.querySelector(s);let token='',state=null,profile=null,identity=null,resultPane='story',demoMode=false;const axisLabels={EI:'E / I',SN:'S / N',TF:'T / F',JP:'J / P'};function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,options={}){const headers={Authorization:'Bearer '+token,...options.headers};if(options.body!==undefined)headers['Content-Type']='application/json';const res=await fetch('/api/aieq'+path,{...options,headers});const body=await res.json();if(!res.ok)throw new Error(body.error||'request_failed');return body}function showError(e){$('#loading').classList.add('hidden');$('#error').classList.remove('hidden');$('#error').textContent='目前無法開啟 AI 人格誌：'+e.message}function switchView(name){['intro','test','result','friends'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==name));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='friends')loadFriends();scrollTo({top:0,behavior:'smooth'})}
function render(){if(!state)return;$('#loading').classList.add('hidden');if(state.mode==='intro'||!state.session){$('#nav').classList.add('hidden');switchView('intro');return}if(state.session.status==='completed'){state.mode='result';$('#nav').classList.remove('hidden');renderResult();switchView('result');return}$('#nav').classList.add('hidden');switchView('test');renderQuestion()}
function renderQuestion(){const q=state.question,index=state.session.currentQuestionIndex,p=Math.round(index/state.session.totalQuestions*100),letters=['A','B','C'];$('#questionCard').innerHTML=`<div class="question-head"><div class="eyebrow">AI PERSONALITY / QUESTION</div><div class="counter">0${index+1}<small>/ 0${state.session.totalQuestions}</small></div></div><div class="progress"><i style="width:${p}%"></i></div><div class="scenario">${safe(q.scenario)}</div><h1 class="prompt">${safe(q.prompt)}</h1>${q.options.map((o,i)=>`<button class="choice" data-option="${safe(o.id)}"><span class="letter">${letters[i]}</span><span><strong>${safe(o.shortLabel)}</strong><span>${safe(o.label)}</span></span></button>`).join('')}<div class="controls"><button class="secondary" data-kind="uncertain">不確定</button><button class="secondary" data-kind="back">上一題</button></div><p class="micro">直接關閉也沒關係，下次會從這題繼續。</p>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>send('answer',b.dataset.option));document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>send(b.dataset.kind))}
async function startAssessment(){state=await api('/sessions',{method:'POST'});render()}
function eventId(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();const bytes=new Uint8Array(16);if(globalThis.crypto?.getRandomValues)globalThis.crypto.getRandomValues(bytes);else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=[...bytes].map(n=>n.toString(16).padStart(2,'0')).join('');return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`}
async function send(kind,optionId){document.querySelectorAll('button').forEach(b=>b.disabled=true);$('#error').classList.add('hidden');try{const body={eventId:eventId(),source:'card',kind,questionId:kind==='back'||kind==='pause'?undefined:state.question.id,optionId,occurredAt:new Date().toISOString()};state=await api(`/sessions/${state.session.id}/events`,{method:'POST',body:JSON.stringify(body)});render()}catch(e){showError(e)}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function clarity(x){const n=Math.round(x.strength);return n>=67?'清晰':n>=34?'中度':'邊界'}
function resultStory(r,a,axes){return `<div class="result-hero"><div class="eyebrow">YOUR AI PERSONALITY IS</div><div class="result-code">${safe(r.preferenceCode)}</div><h1 class="result-title">${safe(a.name)} · ${safe(a.title)}</h1><img class="result-animal" src="${safe(a.resultScenePath)}" alt="${safe(a.name)}人格場景"></div><div class="story-grid"><div class="story"><small>AI SUPERPOWER</small><p>${safe(a.strength)}</p></div><div class="story"><small>BLIND SPOT</small><p>${safe(a.blindSpot)}</p></div><div class="story"><small>NEXT MOVE</small><p>${safe(a.growthRoute)}</p></div></div><h3>四軸傾向清晰度</h3>${axes.map(x=>`<div class="axis"><span>${safe(axisLabels[x.dimension])}</span><div class="bar"><i style="width:${Math.round(x.strength)}%"></i></div><b>${clarity(x)}</b></div>`).join('')}<p class="micro">J / P 目前只有一題，固定標示為低證據量。本結果不代表能力高低或固定命運。</p>`}function coverPane(a,isShare){const avatar=identity?.pictureUrl?`<img class="player-avatar" src="${safe(identity.pictureUrl)}" alt="${safe(identity.displayName||'玩家')} LINE 頭像">`:'';return `<div class="eyebrow">${isShare?'SHARE PREVIEW':'MAGAZINE COVER'}</div><h2>${isShare?'你的分享會長這樣':'你的 AI 人格封面'}</h2><div class="cover-stage"><img src="${safe(a.shareCardPath)}" alt="AI 人格誌 ${safe(a.code)} 分享封面">${avatar}</div><p class="preview-note">${avatar?'已套用你的 LINE 頭像。':'本機預覽使用示意頭像；LINE 開啟後會自動換成玩家頭像。'}</p>${isShare?`<div class="share-actions"><button class="primary" id="resultShareBtn">分享給 LINE 好友</button><a class="secondary" style="display:block;text-decoration:none;text-align:center" href="${safe(a.shareCardPath)}" download>儲存封面底圖</a></div>`:''}`}
function renderResult(){const r=state.result,a=r.animal,axes=Object.values(r.mbtiPreferences);$('#resultCard').innerHTML=`<div class="result"><div class="tabs"><button data-pane="story">人格誌</button><button data-pane="cover">封面</button><button data-pane="share">分享預覽</button></div><div id="pane">${resultPane==='story'?resultStory(r,a,axes):coverPane(a,resultPane==='share')}</div>${resultPane==='story'?`<div class="panel">${profile?'<b>結果已確認</b><p class="micro">分享與個人化仍需另外同意。</p>':'<button id="confirmBtn" class="primary">這很像我，確認結果</button><p class="micro">確認不會自動公開結果。</p>'}</div>`:''}</div>`;document.querySelectorAll('[data-pane]').forEach(b=>{b.classList.toggle('active',b.dataset.pane===resultPane);b.onclick=()=>{resultPane=b.dataset.pane;renderResult();scrollTo({top:0,behavior:'smooth'})}});if($('#confirmBtn'))$('#confirmBtn').onclick=confirmResult;if($('#resultShareBtn'))$('#resultShareBtn').onclick=share}async function confirmResult(){await api(`/sessions/${state.session.id}/confirm`,{method:'POST',body:JSON.stringify({visibleToFriends:false,personalizationConsent:false})});profile=(await api('/me')).profile;renderResult()}
async function loadFriends(){if(demoMode){const friends=[['小雨','ENFP','水獺','/aieq/scenes/results/enfp-otter-v1.png'],['Alex','INTJ','貓頭鷹','/aieq/scenes/results/intj-owl-v1.png'],['Mina','ESFJ','蜜蜂','/aieq/scenes/results/esfj-bee-v1.png']];$('#friendList').innerHTML='<div class="eyebrow">DEMO FRIENDS</div><h3>已連結的朋友</h3>'+friends.map(f=>`<div class="friend"><img src="${f[3]}"><div><b>${f[0]}</b><br><small>${f[2]}型・模擬好友</small></div><b>${f[1]}</b></div>`).join('')+'<p class="micro">以上為本機展示資料，不會寫入正式朋友圈。</p>';return}try{const data=await api('/friends');$('#friendList').innerHTML='<h3>已連結的朋友</h3>'+(data.friends.length?data.friends.map(f=>`<div class="friend"><img src="${safe(f.picture_url||f.animal.imagePath)}"><div><b>${safe(f.display_name||'LINE 朋友')}</b><br><small>${safe(f.animal.name)}型</small></div><b>${safe(f.type_code)}</b></div>`).join(''):'<p class="micro">還沒有朋友出現在這裡。</p>')}catch(e){showError(e)}}
async function share(){if(!profile){alert('請先在人格誌頁確認結果。');resultPane='story';renderResult();return}if(demoMode){$('#inviteCard').classList.remove('hidden');$('#inviteCard').innerHTML=`<div class="eyebrow">DEMO SHARE COMPLETE</div><h3>已模擬分享給 LINE 好友</h3><p>WaitinChen 的 ${safe(state.result.preferenceCode)} ${safe(state.result.animal.name)}人格封面與邀請連結已送出。</p><p class="micro">這是本機展示分支，不會真的傳送訊息或公開資料。</p>`;scrollTo({top:0,behavior:'smooth'});return}const inv=await api('/friend-invites',{method:'POST'});const text=`我的 AI 人格是 ${state.result.preferenceCode} ${state.result.animal.name}。你也來測測看：${inv.url}`;if(window.liff?.isApiAvailable?.('shareTargetPicker'))await liff.shareTargetPicker([{type:'text',text}],{isMultiple:true});else if(navigator.share)await navigator.share({title:'AI Personality｜AI 人格誌',text,url:inv.url});else{await navigator.clipboard.writeText(text);alert('邀請連結已複製')}}async function claimInvite(value){try{const claimed=await api('/friend-invites/'+encodeURIComponent(value)+'/claim',{method:'POST'});$('#inviteCard').innerHTML=claimed.status==='connected'?'<b>你們已成為 AI 人格誌朋友。</b>':'<b>邀請已接受，完成並確認結果後就會建立連結。</b>';loadFriends()}catch(e){$('#inviteCard').textContent='邀請無法使用：'+e.message}}async function deleteData(){if(!confirm('這會永久刪除你的測評、結果、邀請與朋友連結。確定刪除嗎？'))return;await api('/me/data',{method:'DELETE',body:JSON.stringify({confirmation:'DELETE_AIEQ'})});location.href='/aieq'}
function inviteFromUrl(){const params=new URLSearchParams(location.search),direct=params.get('invite');if(direct)return direct;const ls=params.get('liff.state');if(!ls)return null;try{return new URL(decodeURIComponent(ls),location.origin).searchParams.get('invite')}catch{return new URLSearchParams(decodeURIComponent(ls).replace(/^\??/,'')).get('invite')}}async function init(){const cfg=await fetch('/api/aieq/config').then(r=>r.json());demoMode=Boolean(cfg.demoMode);if(demoMode){token='local-demo';$('#modePill').textContent='LOCAL DEMO'}else{if(!cfg.liffId||cfg.liffId==='not-configured')throw new Error('LIFF_ID 尚未設定');await liff.init({liffId:cfg.liffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}token=liff.getIDToken();if(!token)throw new Error('LINE openid 權限尚未開啟')}state=await api('/entry');profile=state.profile;identity=(await api('/me')).identity;render();const invite=inviteFromUrl();if(invite){$('#inviteCard').classList.remove('hidden');$('#inviteCard').innerHTML='<h3>朋友邀請</h3><p>完成並確認結果後，才會正式連結。</p><button class="primary" id="claimBtn">接受邀請</button>';$('#claimBtn').onclick=()=>claimInvite(invite)}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#startBtn').onclick=startAssessment;$('#shareBtn').onclick=share;$('#deleteBtn').onclick=deleteData;init().catch(showError)
</script></body></html>
