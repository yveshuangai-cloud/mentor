.counter{white-space:nowrap;flex:none}.choice{position:relative;overflow:hidden;transform:translateZ(0);transition:border-color .12s ease,background .12s ease,opacity .16s ease,transform .16s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.choice:after{content:"";position:absolute;inset:0;background:var(--green);transform:translateX(-102%);opacity:.16;transition:transform .18s ease}.choice.is-selected{border-color:var(--green);background:rgba(65,255,120,.1);transform:scale(.985)}.choice.is-selected:after{transform:translateX(0)}.choice.is-selected .letter{position:relative;z-index:1;color:var(--green)}.question-shell.is-answering{animation:answer-pulse .28s ease both}.question-shell.is-answering .choice:not(.is-selected){opacity:.28;transform:scale(.97)}.question-shell.question-enter{animation:question-enter .3s cubic-bezier(.2,.8,.2,1) both}@keyframes answer-pulse{0%{transform:translateX(0)}25%{transform:translateX(-5px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}100%{transform:translateX(0)}}@keyframes question-enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

<script>
const $=s=>document.querySelector(s);let token='',state=null,profile=null,identity=null,resultPane='story',demoMode=false;const axisLabels={EI:'E / I',SN:'S / N',TF:'T / F',JP:'J / P'};function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,options={}){const headers={Authorization:'Bearer '+token,...options.headers};if(options.body!==undefined)headers['Content-Type']='application/json';const res=await fetch('/api/aieq'+path,{...options,headers});const body=await res.json();if(!res.ok)throw new Error(body.error||'request_failed');return body}function showError(e){$('#loading').classList.add('hidden');$('#error').classList.remove('hidden');$('#error').textContent='目前無法開啟 AI 人格誌：'+e.message}function switchView(name){['intro','test','result','friends'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==name));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='friends')loadFriends();scrollTo({top:0,behavior:'smooth'})}
function render(){if(!state)return;$('#loading').classList.add('hidden');$('#replayBtn').classList.toggle('hidden',!state.session);if(state.mode==='intro'||!state.session){$('#nav').classList.add('hidden');switchView('intro');return}if(state.session.status==='completed'){state.mode='result';$('#nav').classList.remove('hidden');renderResult();switchView('result');return}$('#nav').classList.add('hidden');switchView('test');renderQuestion()}
function renderQuestion(){const q=state.question,index=state.session.currentQuestionIndex,p=Math.round(index/state.session.totalQuestions*100),letters=['A','B','C'],card=$('#questionCard');card.classList.remove('is-answering','question-enter');card.innerHTML=`<div class="question-head"><div class="eyebrow">AI PERSONALITY / QUESTION</div><div class="counter">0${index+1}<small>/ 0${state.session.totalQuestions}</small></div></div><div class="progress"><i style="width:${p}%"></i></div><div class="scenario">${safe(q.scenario)}</div><h1 class="prompt">${safe(q.prompt)}</h1>${q.options.map((o,i)=>`<button class="choice" data-option="${safe(o.id)}"><span class="letter">${letters[i]}</span><span class="answer-copy"><strong>${safe(o.shortLabel)}</strong><span>${safe(o.label)}</span></span></button>`).join('')}<div class="controls"><button class="secondary" data-kind="uncertain">不確定</button><button class="secondary" data-kind="back">上一題</button></div><p class="micro">直接關閉也沒關係，下次會從這題繼續。</p>`;void card.offsetWidth;card.classList.add('question-enter');document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>selectAnswer(b));document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>send(b.dataset.kind))}
async function selectAnswer(button){if(button.disabled)return;button.classList.add('is-selected');$('#questionCard').classList.add('is-answering');document.querySelectorAll('button').forEach(b=>b.disabled=true);if(navigator.vibrate)navigator.vibrate(35);await new Promise(resolve=>setTimeout(resolve,260));await send('answer',button.dataset.option);if(button.isConnected){button.classList.remove('is-selected');$('#questionCard').classList.remove('is-answering')}}
async function startAssessment(){state=await api('/sessions',{method:'POST'});render()}
function eventId(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();const bytes=new Uint8Array(16);if(globalThis.crypto?.getRandomValues)globalThis.crypto.getRandomValues(bytes);else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=[...bytes].map(n=>n.toString(16).padStart(2,'0')).join('');return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`}
async function send(kind,optionId){document.querySelectorAll('button').forEach(b=>b.disabled=true);$('#error').classList.add('hidden');try{const body={eventId:eventId(),source:'card',kind,questionId:kind==='back'||kind==='pause'?undefined:state.question.id,optionId,occurredAt:new Date().toISOString()};state=await api(`/sessions/${state.session.id}/events`,{method:'POST',body:JSON.stringify(body)});render()}catch(e){showError(e)}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function tendency(x){const n=Math.round(x.strength),p=safe(x.preference);if(!x.evidenceCount)return '這次沒有足夠的作答可以判斷';if(x.evidenceCount<2)return `這次偏 ${p}（只有一題，僅供參考）`;return n>=67?`很明顯偏 ${p}`:n>=34?`比較偏 ${p}`:`兩邊都像，稍微偏 ${p}`}
function radarChart(axes){const cx=160,cy=150,max=104,min=22,points=axes.map((x,i)=>{const a=-Math.PI/2+i*Math.PI/2,r=min+(Math.max(0,Math.min(100,x.strength))/100)*(max-min);return `${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`}).join(' ');const diamond=r=>[[cx,cy-r],[cx+r,cy],[cx,cy+r],[cx-r,cy]].map(p=>p.join(',')).join(' ');return `<svg class="radar" viewBox="0 0 320 300" role="img" aria-label="四種選擇傾向雷達圖"><polygon class="radar-grid" points="${diamond(104)}"/><polygon class="radar-grid" points="${diamond(70)}"/><polygon class="radar-grid" points="${diamond(36)}"/><line class="radar-axis" x1="160" y1="46" x2="160" y2="254"/><line class="radar-axis" x1="56" y1="150" x2="264" y2="150"/><polygon class="radar-shape" points="${points}"/>${points.split(' ').map(p=>{const [x,y]=p.split(',');return `<circle class="radar-dot" cx="${x}" cy="${y}" r="4"/>`}).join('')}<text class="radar-label" x="160" y="24" text-anchor="middle">${safe(axes[0].preference)} · 能量來源</text><text class="radar-label" x="292" y="154" text-anchor="end">${safe(axes[1].preference)} · 接收資訊</text><text class="radar-label" x="160" y="285" text-anchor="middle">${safe(axes[2].preference)} · 做決定</text><text class="radar-label" x="28" y="154">${safe(axes[3].preference)} · 行動方式</text></svg>`}
function resultStory(r,a,axes){const names={EI:'能量來源',SN:'接收資訊',TF:'做決定',JP:'行動方式'};return `<div class="result-hero"><div class="eyebrow">YOUR AI PERSONALITY IS</div><div class="result-code">${safe(r.preferenceCode)}</div><h1 class="result-title">${safe(a.name)} · ${safe(a.title)}</h1><img class="result-animal" src="${safe(a.resultScenePath)}" alt="${safe(a.name)}人格場景"></div><div class="story-grid"><div class="story"><small>你的厲害之處</small><p>${safe(a.strength)}</p></div><div class="story"><small>容易卡住的地方</small><p>${safe(a.blindSpot)}</p></div><div class="story"><small>給你的小建議</small><p>${safe(a.growthRoute)}</p></div></div><div class="radar-card"><h3>你的四種選擇傾向</h3><p>圖形越靠外，代表這次作答越常出現同一種選擇。</p>${radarChart(axes)}<div class="tendency-list">${axes.map(x=>`<div class="tendency"><b>${safe(names[x.dimension])}：${tendency(x)}</b><span>${safe(axisLabels[x.dimension])}，依這次 ${state.session.totalQuestions} 題作答整理</span></div>`).join('')}</div></div><p class="micro">這張圖只是在說你這次比較自然的選擇，沒有哪一邊比較好，也不代表你永遠不會改變。${axes.some(x=>x.evidenceCount<2)?'標示「僅供參考」的項目，是因為這次只有一題可以判斷。':''}</p>`}function coverPane(a,isShare){const avatar=identity?.pictureUrl?`<img class="player-avatar" src="${safe(identity.pictureUrl)}" alt="${safe(identity.displayName||'玩家')} LINE 頭像">`:'';return `<div class="eyebrow">${isShare?'SHARE PREVIEW':'MAGAZINE COVER'}</div><h2>${isShare?'你的分享會長這樣':'你的 AI 人格封面'}</h2><div class="cover-stage"><img src="${safe(a.shareCardPath)}" alt="AI 人格誌 ${safe(a.code)} 分享封面">${avatar}</div><p class="preview-note">${avatar?'已套用你的 LINE 頭像。':'本機預覽使用示意頭像；LINE 開啟後會自動換成玩家頭像。'}</p>${isShare?`<div class="share-actions"><button class="primary" id="resultShareBtn">分享給 LINE 好友</button><a class="secondary" style="display:block;text-decoration:none;text-align:center" href="${safe(a.shareCardPath)}" download>儲存封面底圖</a></div>`:''}`}
function renderResult(){const r=state.result,a=r.animal,axes=['EI','SN','TF','JP'].map(d=>({...r.mbtiPreferences[d],dimension:d}));$('#resultCard').innerHTML=`<div class="result"><div class="tabs"><button data-pane="story">人格誌</button><button data-pane="cover">封面</button><button data-pane="share">分享預覽</button></div><div id="pane">${resultPane==='story'?resultStory(r,a,axes):coverPane(a,resultPane==='share')}</div>${resultPane==='story'?`<div class="panel">${profile?'<b>結果已確認</b><p class="micro">分享與個人化仍需另外同意。</p>':'<button id="confirmBtn" class="primary">這很像我，確認結果</button><p class="micro">確認不會自動公開結果。</p>'}</div>`:''}</div>`;document.querySelectorAll('[data-pane]').forEach(b=>{b.classList.toggle('active',b.dataset.pane===resultPane);b.onclick=()=>{resultPane=b.dataset.pane;renderResult();scrollTo({top:0,behavior:'smooth'})}});if($('#confirmBtn'))$('#confirmBtn').onclick=confirmResult;if($('#resultShareBtn'))$('#resultShareBtn').onclick=share}async function confirmResult(){await api(`/sessions/${state.session.id}/confirm`,{method:'POST',body:JSON.stringify({visibleToFriends:false,personalizationConsent:false})});profile=(await api('/me')).profile;renderResult()}
async function loadFriends(){if(demoMode){const friends=[['小雨','ENFP','水獺','/aieq/scenes/results/enfp-otter-v1.png'],['Alex','INTJ','貓頭鷹','/aieq/scenes/results/intj-owl-v1.png'],['Mina','ESFJ','蜜蜂','/aieq/scenes/results/esfj-bee-v1.png']];$('#friendList').innerHTML='<div class="eyebrow">DEMO FRIENDS</div><h3>已連結的朋友</h3>'+friends.map(f=>`<div class="friend"><img src="${f[3]}"><div><b>${f[0]}</b><br><small>${f[2]}型・模擬好友</small></div><b>${f[1]}</b></div>`).join('')+'<p class="micro">以上為本機展示資料，不會寫入正式朋友圈。</p>';return}try{const data=await api('/friends');$('#friendList').innerHTML='<h3>已連結的朋友</h3>'+(data.friends.length?data.friends.map(f=>`<div class="friend"><img src="${safe(f.picture_url||f.animal.imagePath)}"><div><b>${safe(f.display_name||'LINE 朋友')}</b><br><small>${safe(f.animal.name)}型</small></div><b>${safe(f.type_code)}</b></div>`).join(''):'<p class="micro">還沒有朋友出現在這裡。</p>')}catch(e){showError(e)}}
async function replay(){if(!demoMode&&!confirm('重新測驗會永久刪除目前的答題、結果、邀請與朋友連結，確定要重新玩嗎？'))return;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await api('/me/data',{method:'DELETE',body:JSON.stringify({confirmation:'DELETE_AIEQ'})});location.href='/aieq?v=replay-'+Date.now()}catch(e){showError(e);document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function share(){if(!profile){alert('請先在人格誌頁確認結果。');resultPane='story';renderResult();return}if(demoMode){$('#inviteCard').classList.remove('hidden');$('#inviteCard').innerHTML=`<div class="eyebrow">DEMO SHARE COMPLETE</div><h3>已模擬分享給 LINE 好友</h3><p>WaitinChen 的 ${safe(state.result.preferenceCode)} ${safe(state.result.animal.name)}人格封面與邀請連結已送出。</p><p class="micro">這是本機展示分支，不會真的傳送訊息或公開資料。</p>`;scrollTo({top:0,behavior:'smooth'});return}const inv=await api('/friend-invites',{method:'POST'});const text=`我的 AI 人格是 ${state.result.preferenceCode} ${state.result.animal.name}。你也來測測看：${inv.url}`;if(window.liff?.isApiAvailable?.('shareTargetPicker'))await liff.shareTargetPicker([{type:'text',text}],{isMultiple:true});else if(navigator.share)await navigator.share({title:'AI Personality｜AI 人格誌',text,url:inv.url});else{await navigator.clipboard.writeText(text);alert('邀請連結已複製')}}async function claimInvite(value){try{const claimed=await api('/friend-invites/'+encodeURIComponent(value)+'/claim',{method:'POST'});$('#inviteCard').innerHTML=claimed.status==='connected'?'<b>你們已成為 AI 人格誌朋友。</b>':'<b>邀請已接受，完成並確認結果後就會建立連結。</b>';loadFriends()}catch(e){const why={cannot_friend_self:'這是你自己發出的邀請。把連結傳給朋友，由朋友打開並接受才會生效。',invite_invalid_or_expired:'這個邀請已過期或無效，請朋友再分享一次給你。',invite_already_claimed:'這個邀請已經被另一位朋友使用了，請對方再分享一次給你。'};$('#inviteCard').textContent=why[e.message]||('邀請無法使用：'+e.message)}}async function deleteData(){if(!confirm('這會永久刪除你的測評、結果、邀請與朋友連結。確定刪除嗎？'))return;await api('/me/data',{method:'DELETE',body:JSON.stringify({confirmation:'DELETE_AIEQ'})});location.href='/aieq'}
function inviteFromUrl(){const params=new URLSearchParams(location.search),direct=params.get('invite');if(direct)return direct;const ls=params.get('liff.state');if(!ls)return null;try{return new URL(decodeURIComponent(ls),location.origin).searchParams.get('invite')}catch{return new URLSearchParams(decodeURIComponent(ls).replace(/^\??/,'')).get('invite')}}function demoDeviceId(){try{let id=localStorage.getItem('aieq-demo-device');if(!id){id=eventId();localStorage.setItem('aieq-demo-device',id)}return id}catch{return 'shared-demo'}}async function init(){const cfg=await fetch('/api/aieq/config').then(r=>r.json());demoMode=Boolean(cfg.demoMode);if(demoMode){token='local-demo:'+demoDeviceId();$('#modePill').textContent='LOCAL DEMO'}else{if(!cfg.liffId||cfg.liffId==='not-configured')throw new Error('LIFF_ID 尚未設定');await liff.init({liffId:cfg.liffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}token=liff.getIDToken();if(!token)throw new Error('LINE openid 權限尚未開啟')}state=await api('/entry');profile=state.profile;identity=(await api('/me')).identity;render();const invite=inviteFromUrl();if(invite){$('#inviteCard').classList.remove('hidden');$('#inviteCard').innerHTML='<h3>朋友邀請</h3><p>完成並確認結果後，才會正式連結。</p><button class="primary" id="claimBtn">接受邀請</button>';$('#claimBtn').onclick=()=>claimInvite(invite)}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#startBtn').onclick=startAssessment;$('#shareBtn').onclick=share;$('#deleteBtn').onclick=deleteData;$('#replayBtn').onclick=replay;if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/aieq-sw.js').catch(()=>{});init().catch(showError)
</script></body></html>
